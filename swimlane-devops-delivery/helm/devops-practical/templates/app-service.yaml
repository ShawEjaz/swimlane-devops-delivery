apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-practical.fullname" . }}-svc
  labels:
    {{- include "devops-practical.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "devops-practical.name" . }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.app.containerPort }}
